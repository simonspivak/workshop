# Настройки Supabase CLI для этого репозитория (локальный стек и превью-ветки).
# Боевой проект настраивается в дашборде: см. docs/platform/setup.md.
# Миграции — supabase/migrations, тесты — supabase/tests (`supabase test db`).

project_id = "workshop"

[api]
enabled = true
port = 54321
# Таблицы не экспонируются автоматически: права выдаёт миграция явно
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
# Должна совпадать с версией боевого проекта (Settings → Infrastructure)
major_version = 17

[db.migrations]
enabled = true

[db.seed]
enabled = false

[storage]
enabled = true
file_size_limit = "50MiB"

[storage.buckets.media]
public = false
file_size_limit = "50MiB"
# Список применяется к проду при каждом деплое из main (интеграция Supabase с GitHub) и перекрывает ручные правки бакета.
# Должен совпадать с FILE_TYPES в lib/server/homework/files.ts.
allowed_mime_types = [
  "image/png", "image/jpeg", "image/webp",
  "video/mp4",
  "audio/mpeg", "audio/mp4", "audio/wav", "audio/x-wav", "audio/wave",
  "application/pdf",
  "application/vnd.openxmlformats-officedocument.presentationml.presentation",
  "application/vnd.openxmlformats-officedocument.wordprocessingml.document",
  "text/plain", "text/markdown",
]

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = []
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
# Регистрации нет: учеников создаёт учитель через admin API
enable_signup = false
enable_anonymous_sign_ins = false
minimum_password_length = 10

[auth.email]
enable_signup = false
enable_confirmations = false
double_confirm_changes = true
